<svg width="1800" height="720" viewBox="0 0 1800 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #171717; }
      .box { fill: #353535; stroke: #8a8a8a; stroke-width: 1.2; rx: 18; ry: 18; }
      .title { fill: #f4f4f4; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; }
      .text { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 21px; }
      .arrow { stroke: #d8d8d8; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d8d8d8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="720"/>
  <text class="title" x="900" y="55" text-anchor="middle">Pipeline Architecture</text>

  <!-- Top pipeline -->
  <rect class="box" x="80" y="170" width="210" height="78"/>
  <text class="text" x="185" y="209">Input Image</text>

  <rect class="box" x="360" y="170" width="250" height="78"/>
  <text class="text" x="485" y="209">Keep RGB Channels</text>

  <rect class="box" x="690" y="150" width="310" height="118"/>
  <text class="text" x="845" y="197">Wavelet Smoothing</text>
  <text class="text small" x="845" y="228">Daubechies db4 / db6</text>

  <rect class="box" x="1080" y="150" width="310" height="118"/>
  <text class="text" x="1235" y="197">Scale Detail Coefficients</text>
  <text class="text small" x="1235" y="228">Reconstruct Smoothed Image</text>

  <!-- Branch labels -->
  <rect class="box" x="420" y="410" width="340" height="110"/>
  <text class="text" x="590" y="452">Quadtree Segmentation</text>
  <text class="text small" x="590" y="485">Homogeneity Test + Recursive Split</text>

  <rect class="box" x="980" y="410" width="260" height="110"/>
  <text class="text" x="1110" y="452">K-Means Clustering</text>
  <text class="text small" x="1110" y="485">RGB Color Groups</text>

  <rect class="box" x="300" y="585" width="340" height="88"/>
  <text class="text" x="470" y="629">Quadtree Segmented Image</text>

  <rect class="box" x="790" y="585" width="320" height="88"/>
  <text class="text" x="950" y="629">Comparison and Metrics</text>

  <rect class="box" x="1260" y="585" width="300" height="88"/>
  <text class="text" x="1410" y="629">K-Means Segmented Image</text>

  <!-- Arrows main flow -->
  <path class="arrow" d="M290 209 H360" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M610 209 H690" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1000 209 H1080" marker-end="url(#arrowhead)"/>

  <!-- branch arrows -->
  <path class="arrow" d="M1185 268 C1185 325, 760 330, 620 410" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1285 268 C1285 338, 1160 355, 1125 410" marker-end="url(#arrowhead)"/>

  <!-- outputs -->
  <path class="arrow" d="M540 520 C540 548, 510 560, 490 585" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M650 520 C735 555, 820 565, 880 585" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1110 520 C1080 548, 1015 565, 975 585" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1160 520 C1260 548, 1360 558, 1400 585" marker-end="url(#arrowhead)"/>

  <!-- bottom note -->
  <text class="text small" x="950" y="705">MSE • Intra-region Variance • Number of Segments • Difference Map</text>
</svg>
